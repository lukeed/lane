name: ci

on:
  push:
    branches: [main]
  pull_request:

# Branch runs are superseded by the next push; main runs are never cancelled, so its
# cache save always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gates:
    # ubuntu is ext4, so it exercises the no-reflink paths; macos is APFS and is the only
    # place the extent-sharing assertions actually run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One cache entry per OS, written ONLY on main. Branches restore from it and never
      # save, so the 10 GB repo budget cannot be filled by branch churn.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: rustc --version && cargo --version

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      # Builds the binary itself and drives real git repos in a tmpdir.
      - run: ./scripts/test.sh

  # Every main push whose manifests move writes a new entry and leaves the old one behind
  # until GitHub's own eviction. Keep the newest entry per restore key, drop the rest.
  prune:
    needs: gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --json id,key,createdAt \
            | jq -r 'group_by(.key | sub("-[^-]+$"; ""))
                     | map(sort_by(.createdAt) | reverse | .[1:])
                     | flatten | .[].id' \
            | while read -r id; do
                gh cache delete --repo "$GITHUB_REPOSITORY" "$id"
              done
