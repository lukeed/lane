[package]
name = "lane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The release workflow publishes one flat tarball per target under this name, so
# `cargo binstall` and www/public/install.sh resolve the same asset.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/lane-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# Linux ships musl only, so a glibc host is pointed at it rather than left to
# binstall's fallback order.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/lane-x86_64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/lane-aarch64-unknown-linux-musl.tar.gz"

[lib]
name = "lane"
path = "src/lib.rs"

[[bin]]
name = "lane"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.35"
# Both separators are off by default; clap accepted `--base=main` and `-psrc/x.rs`,
# and a reader who types either should not be told the flag has no value.
pico-args = { version = "0.5.0", features = ["eq-separator", "short-space-opt"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
streaming-iterator = "0.1.9"
rustix = { version = "1.1.4", features = ["fs"] }
tempfile = "3.27.0"
tree-sitter = "0.26.12"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ulid = "3.0.0"
walkdir = "2.5.0"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
